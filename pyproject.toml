[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scthermoflux"
version = "0.1.0"
description = "Coarse-grained nonequilibrium transcriptomic landscape and flux analysis for T2D human pancreatic islets"
requires-python = ">=3.10"
authors = [{name = "Ricardo Romero"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "statsmodels>=0.14"
]

[tool.setuptools.packages.find]
where = ["src"]
